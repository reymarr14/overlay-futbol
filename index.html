<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Sporteros · Overlay fútbol</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;700&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#604ee2;--c:#25c2ff;--g:#edeced;--d:#17123d}
*{box-sizing:border-box;margin:0}
html,body{background:transparent;font-family:Antonio,sans-serif;color:#fff}
#ov{width:1920px;height:1080px;position:relative;overflow:hidden}
body.pt{overflow:hidden}body.pt #ov{width:100vw;height:100vh}
body.pt .sb{top:0}body.pt .xi{position:static!important;width:340px}
body.pt:not(.pt-alertas) #var,body.pt:not(.pt-alertas) #card,body.pt:not(.pt-alertas) #fx,body.pt:not(.pt-banner) #ad,body.pt #cap{display:none!important}
body.pt-banner #ad{left:0;bottom:auto;top:0;transform:none!important}
body.pt-alertas #card{top:20px}body.pt-alertas #var{top:30%}
#sc{position:absolute;inset:0}
@keyframes rise{from{opacity:0;margin-top:70px}}
#sc.on>*{animation:rise .8s cubic-bezier(.2,.8,.2,1)}
.lgo{width:var(--s);height:var(--s);object-fit:contain;flex:none}
.ph{display:grid;place-items:center;background:var(--c1);color:var(--c2);border:4px solid var(--c2);border-radius:50%;font:800 calc(var(--s)*.4) 'Big Shoulders Display';font-style:normal}
.mid-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(160deg,#1d1650,#120e33);box-shadow:0 30px 80px #0009}
.tt{font:800 44px 'Big Shoulders Display';letter-spacing:.04em;background:var(--p);padding:12px 36px;text-align:center}
.pres{width:1240px;overflow:hidden;--s:240px}
.vs{display:flex;align-items:center;justify-content:space-around;padding:50px 30px}
.tm{width:440px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.tm b{font:800 66px/1 'Big Shoulders Display'}
.v{font:800 90px 'Big Shoulders Display';color:var(--c)}
.st{background:var(--g);color:var(--d);text-align:center;font:700 36px Antonio;padding:12px}
/* alineaciones */
.lin{display:flex;gap:18px;align-items:flex-start;--s:80px;background:none;box-shadow:none;transform:translate(-50%,-50%) scale(var(--z,1))}
.col{width:400px;background:linear-gradient(#1d1650,#120e33);border-top:10px solid var(--c1)}
.col .hd{display:flex;align-items:center;gap:16px;padding:14px 20px;font:800 44px/1 'Big Shoulders Display';border-bottom:4px solid var(--c2)}
.subs{width:300px;background:#120e33f2;border-top:6px solid var(--c2)}
.hs{padding:10px 16px;font:700 26px Antonio;color:var(--c);letter-spacing:.08em;text-transform:uppercase}
p.r0,.col p,.xi p,.subs p{display:flex;align-items:center;gap:12px;padding:6px 20px;font:500 31px Antonio;border-top:1px solid #ffffff18;white-space:nowrap}
.subs p{font-size:28px;padding:5px 16px;color:#e6e3f7}
p em{font-style:normal;width:40px;flex:none;color:var(--c);font-weight:700}
p em.up{color:#3ddc84}
p.out{text-decoration:line-through;opacity:.45}
/* narración */
.sb{position:absolute;top:28px;left:50%;transform:translateX(-50%);display:flex;height:92px;--s:62px;box-shadow:0 10px 30px #0008}
.sb>div{display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--d)}
.sb .side{position:relative;width:380px;font:700 42px Antonio}
.sb .side.r{flex-direction:row-reverse}
.side::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--c1) 50%,var(--c2) 50%)}
.sb .sc{position:relative;font:800 72px 'Big Shoulders Display';background:var(--p);width:96px;justify-content:center;padding:0}
.sb .mid{flex-direction:column;justify-content:center;gap:0;background:var(--g);color:var(--d);min-width:210px;padding:0 14px}
.tm2{display:flex;align-items:center;gap:10px}.tm2 b{font:800 46px/1 'Big Shoulders Display'}
.mid small{font:700 30px/1 Antonio;letter-spacing:.04em}
.add{background:#ffd321;color:#222;font:800 30px Antonio;padding:0 10px;border-radius:4px;animation:bl 1.2s infinite alternate}
@keyframes bl{from{box-shadow:0 0 0 #ffd321}to{box-shadow:0 0 18px #ffd321}}
.cnt{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;z-index:2}
.chip{display:grid;place-items:center;min-width:30px;height:26px;padding:0 7px;border-radius:0 0 5px 5px;font:800 19px Antonio;font-style:normal;color:#222}
.chip.y,.cd.yellow{background:#ffd321}.chip.r,.cd.red{background:#e5262b;color:#fff}
.xi{position:absolute;top:150px;width:340px;background:#17123dee;border-top:8px solid var(--c1);--s:60px}
.xi.l{left:24px}.xi.r{right:24px}
.xi .hd{display:flex;align-items:center;gap:12px;padding:10px 16px;font:700 32px Antonio;border-bottom:4px solid var(--c2)}
.xi p{font-size:26px;padding:4px 16px;gap:10px}
.xi em{width:34px}
#cap{position:absolute;border:4px solid var(--c);display:none;box-shadow:0 0 0 2px var(--d)}
#cap.g{background:#25c2ff22;place-items:center;font:700 40px Antonio;color:var(--c)}
#card{position:absolute;top:175px;left:50%;transform:translate(-50%,-30px);opacity:0;transition:.4s;display:flex;align-items:center;gap:18px;background:var(--d);padding:10px 34px 10px 18px;font:700 36px Antonio;border-left:10px solid var(--c1,var(--c))}
#card.on{opacity:1;transform:translate(-50%,0)}
.cd{width:28px;height:40px;border-radius:4px}
.sw{font:800 56px Antonio;color:var(--c);font-style:normal}
#card .bx{display:flex;flex-direction:column;line-height:1.15}
#card .bx small{font:500 24px Antonio;color:#cfcbe8}
.upn{color:#3ddc84}.dn{color:#ff6b6b}
/* entretiempo */
.ht{width:1100px;--s:80px}
.ht .hd{display:flex;justify-content:space-between;align-items:center;padding:20px 36px;font:800 52px 'Big Shoulders Display'}
.ht .hd div{display:flex;align-items:center;gap:18px}
.sr{display:grid;grid-template-columns:90px 1fr 280px 1fr 90px;align-items:center;gap:14px;padding:11px 28px;font:500 32px Antonio;text-align:center}
.bar{height:16px;background:#ffffff1c;display:flex;justify-content:flex-end}.bar.rt{justify-content:flex-start}.bar i{height:100%}
/* VAR */
#var{position:absolute;left:50%;top:400px;transform:translateX(-50%) scale(.8);opacity:0;transition:.4s;pointer-events:none}
#var.on{opacity:1;transform:translateX(-50%) scale(1)}
.vb{position:relative;overflow:hidden;background:#0a0828;border:4px solid var(--c);padding:6px 80px 16px;text-align:center;animation:gl 1.2s infinite alternate}
.vb b{display:block;font:800 170px/1 'Big Shoulders Display';letter-spacing:.2em;padding-left:.2em}
.vb span{font:700 42px Antonio;color:var(--c)}
.vb i{position:absolute;top:0;bottom:0;width:90px;background:linear-gradient(90deg,transparent,#25c2ff88,transparent);animation:sn 1.6s linear infinite}
@keyframes sn{from{left:-100px}to{left:100%}}
@keyframes gl{from{box-shadow:0 0 0 #25c2ff}to{box-shadow:0 0 50px #25c2ffaa}}
/* publicidad */
#ad{position:absolute;bottom:36px;left:50%;transform:translate(-50%,40px);width:920px;height:120px;background:#fff;opacity:0;transition:.6s;display:grid;place-items:center;color:var(--d);font:700 44px Antonio;border-bottom:8px solid var(--p)}
#ad.on{opacity:1;transform:translate(-50%,0)}#ad img{max-width:100%;max-height:100%;object-fit:contain}
/* gol / penal */
#fx{position:absolute;inset:0;display:none;place-items:center;text-align:center;background:radial-gradient(circle,#604ee2cc,#17123dee 70%);--s:130px}
#fx.penal{background:radial-gradient(circle,#25c2ffbb,#17123dee 70%)}
#fx.on{display:grid;animation:fxin 6s forwards}
#fx::before{content:'';position:absolute;inset:0;background:#fff;animation:fl .6s forwards}
@keyframes fxin{0%{opacity:0}5%{opacity:1}90%{opacity:1}100%{opacity:0}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
@keyframes pop{from{transform:scale(.2) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
#fx .big{font:800 380px/.9 'Big Shoulders Display';letter-spacing:.02em;animation:pop .9s cubic-bezier(.2,1.6,.3,1) both}
#fx .who{display:flex;justify-content:center;align-items:center;gap:24px;font:700 70px Antonio;animation:rise .8s .5s both}
/* panel de control */
body.ctl{background:#0f0c2b;font:16px/1.4 Antonio,sans-serif;padding:10px;max-width:720px;margin:auto}
.ctl details{background:#1a1545;margin:6px 0;border-left:6px solid var(--p)}
.ctl summary{padding:9px 14px;font:700 19px Antonio;color:var(--c);cursor:pointer}
.ctl details>div{padding:0 14px 12px}
.ctl label{display:block;margin:5px 0;font-size:14px}
.ctl input,.ctl textarea,.ctl select{width:100%;padding:6px;background:#0f0c2b;color:#fff;border:1px solid #3d3490;font:15px Antonio}
.ctl input[type=checkbox]{width:auto}.ctl input[type=color]{height:32px;padding:2px}.ctl textarea{height:80px;font:13px monospace}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctl button{padding:8px 14px;background:var(--p);color:#fff;border:0;font:700 16px Antonio;cursor:pointer}
.ctl button.on{background:var(--c);color:var(--d)}.ctl button.g{background:#2a7a3b}.ctl button.y{background:#ffd321;color:#222}.ctl button.r{background:#e5262b}.ctl button.k{background:#3d3490}
</style></head><body>
<div id="ov"><div id="sc"></div><div id="cap"></div><div id="var"></div><div id="card"></div><div id="ad"></div><div id="fx"></div></div>
<script>
const K='sporteros_futbol_v1',CTL=location.search.includes('control');
const PART=CTL?null:new URLSearchParams(location.search).get('parte');if(PART)document.body.classList.add('pt','pt-'+PART);
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D={scene:'none',comp:'Liga 1 · Fecha 12',stadium:'Estadio Nacional',
h:{name:'Equipo Local',logo:'',color:'#604ee2',color2:'#25c2ff'},a:{name:'Equipo Visita',logo:'',color:'#25c2ff',color2:'#edeced'},
sh:0,sa:0,cards:{h:{y:0,r:0},a:{y:0,r:0}},period:'1T',added:'',clock:{base:0,t0:null},
lin:{h:[],a:[],hs:[],as:[]},stats:[],lscale:1,xiTop:470,sbAlways:false,capOn:false,capGuide:false,cx:460,cy:230,cw:1000,ch:560,
ads:[],adEvery:60,adShow:10,adOn:false,varOn:false,varTxt:'',ev:{id:0}};
const load=j=>{const s=JSON.parse(j||'{}');return {...D,...s,h:{...D.h,...s.h},a:{...D.a,...s.a},cards:{...D.cards,...s.cards},lin:{...D.lin,...s.lin}}};
let S=load(localStorage.getItem(K));
const save=()=>{localStorage.setItem(K,JSON.stringify(S));render()};
addEventListener('storage',e=>{if(e.key===K){S=load(e.newValue);render()}});
const cs=t=>`--c1:${esc(t.color)};--c2:${esc(t.color2)}`,th=t=>`style="${cs(t)}"`;
const lg=t=>t.logo?`<img class="lgo" src="${esc(t.logo)}" alt="">`:`<i class="lgo ph" style="${cs(t)}">${esc(t.name.slice(0,2))}</i>`;
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const row=p=>`<p class="${p.out?'out':''}"><em class="${p.in?'up':''}">${p.in?'▲':esc(p.n??'')}</em><span>${esc(p.name)}</span></p>`;
const xi=t=>(S.lin[t]||[]).slice(0,11).map(row).join('');
const col=t=>`<div class="col" ${th(S[t])}><div class="hd">${lg(S[t])}${esc(S[t].name)}</div>${xi(t)}</div>`;
const sbp=t=>{const b=S.lin[t+'s']||[];return b.length?`<div class="subs" ${th(S[t])}><div class="hs">Suplentes</div>${b.map(row).join('')}</div>`:''};
const cnt=t=>{const c=S.cards[t];return `<div class="cnt">${c.y?`<i class="chip y">${c.y}</i>`:''}${c.r?`<i class="chip r">${c.r}</i>`:''}</div>`};
const SC={
pres:()=>`<div class="mid-c pres"><div class="tt">${esc(S.comp)}</div><div class="vs"><div class="tm">${lg(S.h)}<b>${esc(S.h.name)}</b></div><span class="v">VS</span><div class="tm">${lg(S.a)}<b>${esc(S.a.name)}</b></div></div><div class="st">${esc(S.stadium)}</div></div>`,
lin:()=>`<div class="mid-c lin" style="--z:${S.lscale}">${sbp('h')}${col('h')}${col('a')}${sbp('a')}</div>`,
play:()=>`<div class="sb"><div class="side" ${th(S.h)}>${lg(S.h)}${esc(S.h.name)}</div><div class="sc">${S.sh}${cnt('h')}</div><div class="mid"><div class="tm2"><b id="clk"></b>${S.added?`<span class="add">+${esc(String(S.added).replace(/^\+/,''))}</span>`:''}</div><small>${esc(S.period)}</small></div><div class="sc">${S.sa}${cnt('a')}</div><div class="side r" ${th(S.a)}>${lg(S.a)}${esc(S.a.name)}</div></div>`+
 ['h','a'].map((t,i)=>`<div class="xi ${i?'r':'l'}" style="${cs(S[t])};top:${S.xiTop}px"><div class="hd">${lg(S[t])}${esc(S[t].name)}</div>${xi(t)}</div>`).join(''),
ht:()=>`<div class="mid-c ht"><div class="tt">${esc(S.comp)} · Entretiempo ${S.sh} - ${S.sa}</div><div class="hd"><div>${lg(S.h)}${esc(S.h.name)}</div><div>${esc(S.a.name)}${lg(S.a)}</div></div>`+
 S.stats.map(r=>{const a=parseFloat(r.h)||0,b=parseFloat(r.a)||0,p=a+b?a/(a+b)*100:50;return `<div class="sr"><b>${esc(r.h)}</b><div class="bar"><i style="width:${p}%;background:linear-gradient(90deg,${esc(S.h.color2)},${esc(S.h.color)})"></i></div><span>${esc(r.label)}</span><div class="bar rt"><i style="width:${100-p}%;background:linear-gradient(90deg,${esc(S.a.color)},${esc(S.a.color2)})"></i></div><b>${esc(r.a)}</b></div>`}).join('')+`<div style="height:20px"></div></div>`};
const pl=()=>{const t=document.createElement('div');t.innerHTML=SC.play();return[...t.children].map(e=>e.outerHTML)};
const PT={marcador:()=>pl()[0],'titulares-local':()=>pl()[1],'titulares-visita':()=>pl()[2],alineaciones:SC.lin,presentacion:SC.pres,estadisticas:SC.ht};
const VIS=p=>({marcador:S.scene=='play'||S.sbAlways,'titulares-local':S.scene=='play','titulares-visita':S.scene=='play',alineaciones:S.scene=='lin',presentacion:S.scene=='pres',estadisticas:S.scene=='ht'})[p];
function tick(){const c=$('#clk');if(c)c.textContent=fmt(S.clock.base+(S.clock.t0?(Date.now()-S.clock.t0)/1000:0))}
setInterval(()=>{if(!CTL)tick()},250);
function fx(e){const t=S[e.side]||S.h;
 if(['yellow','red','sub'].includes(e.type)){const c=$('#card');c.style.setProperty('--c1',t.color);
  if(e.type=='sub'){const[i,o]=(e.text||'|').split('|');c.innerHTML=`<i class="sw">⇄</i><div class="bx"><small>Cambio · ${esc(t.name)}</small><span class="upn">▲ ${esc(i)}</span><span class="dn">▼ ${esc(o)}</span></div>`}
  else c.innerHTML=`<i class="cd ${e.type}"></i><span>${e.type=='red'?'Roja':'Amarilla'} · ${esc(e.text||'')} ${esc(t.name)}</span>`;
  c.classList.add('on');setTimeout(()=>c.classList.remove('on'),e.type=='sub'?7000:5000);return}
 const f=$('#fx');f.className='';void f.offsetWidth;f.className='on '+e.type;
 f.innerHTML=`<div><div class="big">${e.type=='goal'?'GOOOL':'PENAL'}</div><div class="who">${lg(t)}<b>${esc(t.name)}</b><span>${esc(e.text||'')}</span></div></div>`;
 setTimeout(()=>f.className='',6000)}
let prev='',lastEv=null,lastAk='',ai=0,at,ah;
function ads(){clearInterval(at);clearTimeout(ah);const a=$('#ad');a.classList.remove('on');if(!S.adOn||!S.ads.length)return;
 const go=()=>{const x=S.ads[ai++%S.ads.length];a.innerHTML=/^(https?:|data:)/.test(x)?`<img src="${esc(x)}" alt="">`:`<span>${esc(x)}</span>`;a.classList.add('on');ah=setTimeout(()=>a.classList.remove('on'),S.adShow*1000)};
 go();at=setInterval(go,Math.max(S.adEvery,S.adShow+2)*1000)}
function render(){
 if(CTL){document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('on',b.dataset.sc==S.scene));return}
 const sc=$('#sc'),vis=PART?!!VIS(PART):!!SC[S.scene],key=PART?+vis:S.scene;
 sc.innerHTML=PART?(vis&&PT[PART]?PT[PART]():''):(SC[S.scene]?SC[S.scene]():'');
 if(key!==prev){prev=key;sc.className='';void sc.offsetWidth;sc.className='on';setTimeout(()=>sc.className='',1300)}
 const cp=$('#cap'),show=S.scene=='play'&&S.capOn&&!PART;cp.style.display=show?(S.capGuide?'grid':'block'):'none';
 Object.assign(cp.style,{left:S.cx+'px',top:S.cy+'px',width:S.cw+'px',height:S.ch+'px'});cp.className=S.capGuide?'g':'';cp.textContent=S.capGuide?'Captura AiScore / 365Scores':'';
 const v=$('#var');if(S.varOn){if(!v.classList.contains('on')||v.dataset.t!==S.varTxt){v.innerHTML=`<div class="vb"><b>VAR</b><span>${esc(S.varTxt||'Revisión en curso')}</span><i></i></div>`;v.dataset.t=S.varTxt;v.classList.add('on')}}else v.classList.remove('on');
 const ak=JSON.stringify([S.adOn,S.ads,S.adEvery,S.adShow]);if(ak!==lastAk){lastAk=ak;if(!PART||PART=='banner')ads()}
 if(S.ev.id!==lastEv){const fresh=lastEv!==null&&Date.now()-S.ev.id<8000;lastEv=S.ev.id;if(fresh&&(!PART||PART=='alertas'))fx(S.ev)}
 tick()}
/* ---------- panel de control ---------- */
const get=k=>k.split('.').reduce((o,x)=>o[x],S);
const set=(p,v)=>{const k=p.split('.');let o=S;while(k.length>1)o=o[k.shift()];o[k[0]]=v;save()};
const inp=(l,k,ty='text',ph='')=>`<label>${l}<input type="${ty}" data-k="${k}" value="${esc(get(k))}" placeholder="${ph}"></label>`;
const chk=(l,k)=>`<label><input type="checkbox" data-k="${k}" ${get(k)?'checked':''}> ${l}</label>`;
const sec=(t,b,o)=>`<details ${o?'open':''}><summary>${t}</summary><div>${b}</div></details>`;
const TN={h:'Local',a:'Visita'};
const B=location.href.split(/[?#]/)[0],PL=[['marcador','1200×130'],['titulares-local','340×540'],['titulares-visita','340×540'],['alineaciones','1480×800'],['presentacion','1260×500'],['estadisticas','1120×560'],['banner','920×130'],['alertas','el tamaño de tu escena']];
const EX_LIN='{"h":[{"n":1,"name":"Portero"},{"n":2,"name":"Lateral D."},{"n":4,"name":"Central"},{"n":5,"name":"Central"},{"n":3,"name":"Lateral I."},{"n":6,"name":"Volante"},{"n":8,"name":"Interior"},{"n":10,"name":"Enganche (C)"},{"n":7,"name":"Extremo"},{"n":9,"name":"Delantero"},{"n":11,"name":"Extremo"}],"a":[],"hs":[{"name":"Suplente 1"},{"name":"Suplente 2"}],"as":[]}';
const EX_ST='[{"label":"Posesión","h":58,"a":42},{"label":"Tiros","h":9,"a":5},{"label":"Tiros al arco","h":4,"a":2},{"label":"Córners","h":6,"a":3},{"label":"Faltas","h":7,"a":10}]';
function fillSubs(){['h','a'].forEach(t=>{const f=(S.lin[t]||[]).slice(0,11),b=S.lin[t+'s']||[];
 $('#o'+t).innerHTML=f.map((p,i)=>`<option value="${i}">${p.in?'▲':esc(p.n??'')} ${esc(p.name)}</option>`).join('');
 $('#i'+t).innerHTML=b.map((p,j)=>p.out?'':`<option value="${j}">${esc(p.name)}</option>`).join('')})}
function ctl(){document.body.className='ctl';
 const evb=t=>`<div class="row"><b style="width:56px">${TN[t]}</b><button class="g" data-a="goal" data-t="${t}">Gol +1</button><button class="k" data-a="dec" data-t="${t}">−1</button><button data-a="penal" data-t="${t}">Penal</button><button class="y" data-a="yellow" data-t="${t}">Amarilla</button><button class="r" data-a="red" data-t="${t}">Roja</button><button class="k" data-a="ydec" data-t="${t}">−A</button><button class="k" data-a="rdec" data-t="${t}">−R</button></div>`;
 const swb=t=>`<div class="row"><b style="width:56px">${TN[t]}</b></div><div class="two"><label>Sale<select id="o${t}"></select></label><label>Entra<select id="i${t}"></select></label></div><button data-a="sub" data-t="${t}">Registrar cambio ${TN[t]}</button>`;
 document.body.insertAdjacentHTML('beforeend',
 sec('Escena',`<div class="row">${[['none','Limpio'],['pres','Presentación'],['lin','Alineaciones'],['play','Narración'],['ht','Entretiempo']].map(([s,t])=>`<button data-sc="${s}">${t}</button>`).join('')}</div>`,1)+
 sec('Marcador y eventos',`<label>Jugador / texto (gol, tarjetas, subtítulo del VAR)<input id="who"></label>${evb('h')}${evb('a')}<div class="row"><b style="width:56px">VAR</b><button data-a="varon">Iniciar VAR</button><button class="k" data-a="varoff">Cerrar VAR</button><button class="k" data-a="reset">Reiniciar partido</button></div>`,1)+
 sec('Reloj',`<div class="row"><button class="g" data-a="start">Iniciar</button><button data-a="pause">Pausar</button><button class="k" data-a="setmin">Fijar minuto</button><input id="min" type="number" value="0" style="width:80px"></div><div class="two">${inp('Tiempo (1T, 2T, ET…)','period')}${inp('Añadido (ej. 3)','added')}</div>`,1)+
 sec('Cambios',`${swb('h')}${swb('a')}`)+
 sec('Partido',`${inp('Competición','comp')}${inp('Estadio','stadium')}<div class="two">${['h','a'].map(t=>`<div><b>${TN[t]}</b>${inp('Nombre',t+'.name')}${inp('Logo (URL)',t+'.logo','text','https://…')}<div class="two">${inp('Color 1',t+'.color','color')}${inp('Color 2',t+'.color2','color')}</div></div>`).join('')}</div>`)+
 sec('Alineaciones (JSON)',`<textarea id="jl" placeholder='{"h":[…],"a":[…],"hs":[…],"as":[…]}'></textarea><div class="row"><button data-a="loadlin">Cargar</button><button class="k" data-a="exlin">Ejemplo</button></div><label>Escala del panel<input type="range" min="0.5" max="1.2" step="0.05" data-k="lscale" value="${S.lscale}"></label>${inp('Narración: posición Y de los titulares','xiTop','number')}`)+
 sec('Estadísticas (JSON)',`<textarea id="js" placeholder='[{"label":"Posesión","h":58,"a":42}]'></textarea><div class="row"><button data-a="loadst">Cargar</button><button class="k" data-a="exst">Ejemplo</button></div>`)+
 sec('Zona de captura',`${chk('Mostrar marco en Narración','capOn')}${chk('Relleno guía (para ubicar, luego desactivar)','capGuide')}<div class="four">${inp('X','cx','number')}${inp('Y','cy','number')}${inp('Ancho','cw','number')}${inp('Alto','ch','number')}</div>`)+
 sec('Partes (vertical / TikTok)',`${chk('Marcador siempre visible','sbAlways')}<p style="font-size:13px;color:#9d97c9">Agrega cada URL como fuente de navegador con el tamaño indicado.</p>${PL.map(([n,z])=>`<label>${n} · ${z}<span class="row"><input readonly value="${B}?parte=${n}" onclick="this.select()" style="flex:1"><button class="k" data-a="copy" data-u="${B}?parte=${n}">Copiar</button></span></label>`).join('')}`)+
 sec('Publicidad',`<label>Una por línea: URL de imagen o texto<textarea data-ads>${esc(S.ads.join('\n'))}</textarea></label><div class="two">${inp('Cada (seg)','adEvery','number')}${inp('Visible (seg)','adShow','number')}</div>${chk('Banner activo','adOn')}`));
 document.body.oninput=e=>{const t=e.target;if(t.dataset.k)set(t.dataset.k,t.type=='checkbox'?t.checked:(t.type=='number'||t.type=='range')?+t.value:t.value);
  if(t.dataset.ads!==undefined){S.ads=t.value.split('\n').map(x=>x.trim()).filter(Boolean);save()}};
 document.body.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,t=d.t,who=$('#who').value.trim();
  const ev=(type,side,text)=>{S.ev={id:Date.now(),type,side,text};save()},c=()=>S.cards[t];
  if(d.sc){S.scene=d.sc;save()}
  else if(d.a=='goal'){S['s'+t]++;ev('goal',t,who)}
  else if(d.a=='dec'){S['s'+t]=Math.max(0,S['s'+t]-1);save()}
  else if(d.a=='penal')ev('penal',t,who);
  else if(d.a=='yellow'){c().y++;ev('yellow',t,who)}
  else if(d.a=='red'){c().r++;ev('red',t,who)}
  else if(d.a=='ydec'){c().y=Math.max(0,c().y-1);save()}
  else if(d.a=='rdec'){c().r=Math.max(0,c().r-1);save()}
  else if(d.a=='varon'){S.varOn=true;S.varTxt=who;save()}
  else if(d.a=='varoff'){S.varOn=false;save()}
  else if(d.a=='reset'){if(confirm('¿Reiniciar marcador, tarjetas, reloj y VAR?')){S.sh=S.sa=0;S.cards={h:{y:0,r:0},a:{y:0,r:0}};S.clock={base:0,t0:null};S.varOn=false;save()}}
  else if(d.a=='start'){if(!S.clock.t0)S.clock.t0=Date.now();save()}
  else if(d.a=='pause'){if(S.clock.t0){S.clock.base+=(Date.now()-S.clock.t0)/1000;S.clock.t0=null}save()}
  else if(d.a=='setmin'){S.clock.base=(+$('#min').value||0)*60;if(S.clock.t0)S.clock.t0=Date.now();save()}
  else if(d.a=='sub'){const f=S.lin[t],s=S.lin[t+'s'],i=$('#o'+t).value,j=$('#i'+t).value;if(i===''||j===''||!f[i]||!s[j])return;
   const o=f[i],n=s[j];f[i]={n:'',name:n.name,in:1};s[j]={...o,out:1};ev('sub',t,n.name+'|'+o.name);fillSubs()}
  else if(d.a=='copy'){const u=d.u;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).catch(()=>prompt('Copia la URL:',u))}
  else if(d.a=='exlin')$('#jl').value=EX_LIN;
  else if(d.a=='exst')$('#js').value=EX_ST;
  else if(d.a=='loadlin'){try{const j=JSON.parse($('#jl').value);S.lin={h:j.h||j.home||[],a:j.a||j.away||[],hs:j.hs||[],as:j.as||[]};save();fillSubs()}catch(x){alert('JSON de alineaciones no válido')}}
  else if(d.a=='loadst'){try{S.stats=JSON.parse($('#js').value);save()}catch(x){alert('JSON de estadísticas no válido')}}};
 $('#ov').remove();fillSubs();render()}
if(CTL)ctl();render();
</script></body></html>
